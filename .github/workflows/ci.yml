name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests (PHPUnit)
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coffee_shop_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Copy .env
        run: cp backend/.env.example backend/.env

      - name: Ensure bootstrap/cache and storage directories exist
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
          chmod -R 775 bootstrap storage

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Discover packages
        working-directory: backend
        run: php artisan package:discover --ansi

      - name: Generate application key
        working-directory: backend
        run: php artisan key:generate

      - name: Run migrations
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: coffee_shop_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: coffee_shop_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php vendor/bin/phpunit --testdox

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm test

  code-style-checks:
    name: Code Style Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Ensure bootstrap/cache directory exists
        working-directory: backend
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs

      - name: Install Composer dependencies (Backend)
        working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Discover packages
        working-directory: backend
        run: php artisan package:discover --ansi

      - name: Run Laravel Pint (Backend)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Run ESLint (Frontend)
        working-directory: frontend
        run: npm run lint

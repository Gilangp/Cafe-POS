version: '3.8'

services:
  # MySQL 8.0 Service untuk Testing
  mysql:
    image: mysql:8.0
    container_name: coffee_shop_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coffee_shop_testing
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - coffee_shop_test

  # Backend Laravel Service
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee_shop_backend_test
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coffee_shop_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
      APP_KEY: base64:TEST_KEY_32_CHARACTERS_LONG==
      BCRYPT_ROUNDS: 4
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - coffee_shop_test
    command: >
      bash -c "
        echo '⏳ Waiting for MySQL...' &&
        php artisan config:clear &&
        php artisan cache:clear &&
        echo '🔄 Running migrations...' &&
        php artisan migrate --force &&
        echo '🧪 Running PHPUnit tests...' &&
        php vendor/bin/phpunit --testdox
      "

  # Frontend Node Service
  node:
    image: node:20-alpine
    container_name: coffee_shop_frontend_test
    working_dir: /app
    volumes:
      - ./frontend:/app
    networks:
      - coffee_shop_test
    command: >
      sh -c "
        echo '📦 Installing dependencies...' &&
        npm ci &&
        echo '🧪 Running Vitest...' &&
        npm test
      "

networks:
  coffee_shop_test:
    driver: bridge
